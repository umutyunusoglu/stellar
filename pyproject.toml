[project]
name = "stellar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "ipykernel>=7.3.0",
  "matplotlib>=3.11.1",
  "networkx>=3.6.1",
  "numpy>=2.5.2",
  "pydantic>=2.13.4",
  "scipy>=1.18.0",
  "scipy-stubs~=1.18.0",
  "types-networkx>=3.6.1.20260728",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]
